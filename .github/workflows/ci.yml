name: ci

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      act: ${{ steps.runner.outputs.act }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect act
        id: runner
        shell: bash
        run: echo "act=${ACT:-false}" >>"$GITHUB_OUTPUT"

      - uses: arduino/setup-task@v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install tools
        run: scripts/ci-install-tools.sh

      - name: Lint
        run: task lint

      - name: Unit tests
        run: task test

  e2e:
    name: e2e on k3d
    needs: lint
    # Add [skip e2e] to a commit message to skip this job for that push
    if: ${{ needs.lint.outputs.act != 'true' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip e2e]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: arduino/setup-task@v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install tools
        run: scripts/ci-install-tools.sh --e2e

      - name: Build the lab
        run: task all

      - name: Acceptance tests
        run: task test:all

      - name: Debug on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "## Debug: CI failure"
            echo '### Pods'; echo '```'; kubectl get pods -A || true; echo '```'
            echo '### Vault'; echo '```'; kubectl logs vault-0 -n vault --tail=200 || true; echo '```'
            for pair in mcp-server-dev/mcp-orders mcp-client-orders-agent/mcp-client \
              mcp-client-reporting-agent/mcp-client mcp-client-unlisted/mcp-client; do
              ns="${pair%/*}"; deploy="${pair#*/}"
              echo "### ${ns}"; echo '```'
              if [ "${ns}" = mcp-server-dev ]; then
                kubectl logs -n "${ns}" "deploy/${deploy}" -c vault-proxy --tail=50 || true
              fi
              kubectl logs -n "${ns}" "deploy/${deploy}" -c app --tail=50 || true
              echo '```'
            done
            echo '### Better Auth and Dex'; echo '```'
            kubectl logs -n better-auth deploy/better-auth --tail=50 || true
            kubectl logs -n dex deploy/dex --tail=50 || true
            echo '```'
            echo '### Events'; echo '```'
            kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
