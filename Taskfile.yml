version: '3'

# OAuth for an MCP server on k3d: people sign in through Better Auth and Dex, and client pods log in with
# their Kubernetes ServiceAccount. The MCP server verifies Better Auth's JWTs by JWKS, authorises tools by
# scope, and reads dynamic PostgreSQL credentials from HashiCorp Vault through Vault Proxy.
# Design: docs/solution-design.md

vars:
  cluster_name: vault-mcp-lab
  k3s_image: rancher/k3s:v1.36.6-k3s1
  vault_chart_version: "0.34.1"
  vault_image: hashicorp/vault
  vault_version_tag: "2.2.2"
  postgres_image: postgres:16-alpine
  app_image: localhost/mcp-lab:local
  auth_image: localhost/mcp-lab-auth:local
  dex_chart_version: "0.26.0"
  dex_version_tag: v2.46.1
  # MCP Inspector (npx) for task mcp:inspector; v2 needs Node >= 22.19
  inspector_version: "2.13.0"
  # act runner image for ci:act; ubuntu-latest on GitHub is 24.04
  act_image: catthehacker/ubuntu:act-24.04
  container_cli:
    sh: command -v podman >/dev/null 2>&1 && echo podman || echo docker
  # TTLs: db max_ttl must never exceed token_max_ttl (leases are children of the Proxy token)
  db_default_ttl: 10m
  db_max_ttl: 30m
  token_ttl: 15m
  token_max_ttl: 30m
  # Laptop port for the MCP server (127.0.0.1 only -> NodePort 30800). Fixed at cluster create time.
  mcp_host_port: "8000"
  # Laptop ports for Better Auth and Dex. The Services use the same ports, so pods and the laptop share one URL.
  auth_host_port: "3000"
  dex_host_port: "5556"
  # Lifetime of Better Auth access tokens, in seconds
  access_token_ttl_seconds: "300"
  # How long a sign-in can be used before the person must sign in again, in seconds. Refresh does not extend it.
  sign_in_ttl_seconds: "28800"
  # How often each client pod calls the MCP server
  client_interval_seconds: "20"
  # A6 (expiry) shortens the access token TTL to this for one run, in seconds
  demo_token_ttl_seconds: "20"

dotenv:
  - .env

# Pin lab commands to the lab cluster, whichever kubectl context is selected
env:
  KUBECONTEXT: k3d-{{.cluster_name}}
  HELM_KUBECONTEXT: k3d-{{.cluster_name}}

tasks:
  # ==========================================================================
  # Standard interface
  # ==========================================================================
  default:
    silent: true
    cmds:
      - task --list

  init:
    desc: One-time setup - install pre-commit hooks, add Helm repos, create .env, sync Python and Node packages
    cmds:
      - task: deps
      - |
        if command -v pre-commit >/dev/null 2>&1; then
          pre-commit install
        else
          echo "Note: pre-commit not installed, skipping hook install (needed only for task lint)"
        fi
      - helm repo add hashicorp https://helm.releases.hashicorp.com 2>/dev/null || true
      - helm repo add dex https://charts.dexidp.io 2>/dev/null || true
      - helm repo update hashicorp dex
      - test -f .env || cp .env.template .env
      - uv sync --project app
      - task: auth:deps

  deps:
    desc: Check required CLI tools are installed
    aliases: [prerequisites]
    silent: true
    cmds:
      - scripts/check-deps.sh

  lint:
    desc: Run all pre-commit hooks (yamllint, shellcheck, hadolint, ruff, biome, tsc) and a full gitleaks scan
    cmds:
      - scripts/check-deps.sh --lint
      - task: auth:deps
      - pre-commit run --all-files
      # The pre-commit gitleaks hook only sees staged changes; also scan the full git history.
      - gitleaks git --redact --no-banner

  test:
    desc: Run the Python and Better Auth unit tests and the script tests, no cluster needed
    cmds:
      - task: test:unit
      - task: test:auth
      - task: test:scripts

  test:auth:
    desc: Run the Better Auth service unit tests (no cluster needed)
    dir: auth
    deps: [auth:deps]
    cmds:
      - npm test --silent

  test:unit:
    desc: Run the Python unit tests (pytest, no cluster needed)
    dir: app
    cmds:
      - uv run --frozen pytest -q

  test:scripts:
    desc: Run the Bash script tests (no cluster needed)
    cmds:
      - scripts/test-check-deps.sh
      - scripts/test-ci-act.sh
      - scripts/test-kube-context.sh

  build:
    desc: Build the mcp-lab image (server and client) and import it into the k3d cluster
    run: once # deploy:mcp-server and deploy:mcp-clients both need it; build it once per task run
    cmds:
      - mkdir -p .tmp
      - "{{.container_cli}} build -t {{.app_image}} app"
      - "{{.container_cli}} save -o .tmp/mcp-lab.tar {{.app_image}}"
      - k3d image import .tmp/mcp-lab.tar -c {{.cluster_name}}
      - rm -f .tmp/mcp-lab.tar

  test:all:
    desc: Unit tests plus live acceptance checks on the running lab (M1-M8, A1-A12, H1-H13)
    cmds:
      - task: test
      - task: demo:mcp
      - task: demo:mcp-auth
      - task: demo:human-auth

  test:ci:
    desc: CI pipeline - lint, unit tests and the GitHub lint job under act; with E2E=true also builds the lab and runs test:all
    cmds:
      - task: lint
      - task: test
      - task: ci:act
      - |
        if [ "${E2E:-false}" = "true" ]; then
          task all && task test:all
        else
          echo "E2E not requested (set E2E=true to build the lab and run test:all)"
        fi

  ci:act:
    desc: Run the GitHub "lint and unit tests" job locally in a container with act (needs act and a Docker socket)
    preconditions:
      - sh: command -v act
        msg: "act is not installed (brew install act); it runs .github/workflows/ci.yml locally"
    cmds:
      # .env holds the Vault root token, and act would otherwise load it into the job container
      - act push -j lint --env-file /dev/null -P ubuntu-latest={{.act_image}}

  clean:
    desc: Delete the k3d cluster, Vault init data and temporary files
    prompt: This deletes the cluster and vault-init.json. Continue?
    cmds:
      - k3d cluster delete {{.cluster_name}} || true
      - rm -f vault-init.json .env.bak
      - rm -rf .tmp/* app/.pytest_cache app/.ruff_cache

  up:
    desc: Build the whole lab from scratch (alias of all)
    cmds:
      - task: all

  down:
    desc: Stop the k3d cluster, keeping its data (alias of cluster:stop)
    cmds:
      - task: cluster:stop

  # ==========================================================================
  # Workflow
  # ==========================================================================
  all:
    desc: prerequisites -> cluster -> Vault -> config -> deploy -> verify
    cmds:
      - task: deps
      - task: cluster:up
      - task: config:aliases
      - task: install
      - task: install:postgres
      - task: config:db-secret
      - task: config:k8s-auth
      - task: install:dex
      - task: config:auth-db
      - task: auth:deploy
      - task: deploy:mcp-server
      - task: deploy:mcp-clients

  install:
    desc: Install, initialise, unseal and configure Vault
    cmds:
      - task: install:vault
      - task: init:vault
      - task: unseal:vault
      - task: config:vault

  # ==========================================================================
  # Cluster
  # ==========================================================================
  cluster:up:
    desc: Create or start the k3d cluster (Vault, MCP, Better Auth and Dex on 127.0.0.1)
    aliases: [start, k3d]
    cmds:
      - scripts/cluster-up.sh {{.cluster_name}} {{.k3s_image}} {{.mcp_host_port}} {{.auth_host_port}} {{.dex_host_port}}
      - scripts/cluster-ready.sh {{.cluster_name}}

  cluster:stop:
    desc: Stop the k3d cluster (data kept; run unseal:vault after cluster:up)
    cmds:
      - k3d cluster stop {{.cluster_name}}

  cluster:down:
    desc: Delete the k3d cluster
    cmds:
      - k3d cluster delete {{.cluster_name}} || true

  # ==========================================================================
  # Vault
  # ==========================================================================
  install:vault:
    desc: Helm install HashiCorp Vault (single-node Raft, NodePort 30820)
    cmds:
      - kubectl --context "$KUBECONTEXT" create namespace vault --dry-run=client -o yaml | kubectl --context "$KUBECONTEXT" apply -f -
      - >-
        helm upgrade --install vault hashicorp/vault
        --version {{.vault_chart_version}} -n vault
        --values vault/vault-values.yaml
        --set server.image.repository={{.vault_image}}
        --set server.image.tag={{.vault_version_tag}}
      - |
        for i in $(seq 1 30); do
          kubectl --context "$KUBECONTEXT" get pod vault-0 -n vault >/dev/null 2>&1 && break
          sleep 2
        done
      - kubectl --context "$KUBECONTEXT" wait --for=jsonpath='{.status.phase}'=Running pod/vault-0 -n vault --timeout=5m

  init:vault:
    desc: Initialise Vault once; writes vault-init.json and .env
    cmds:
      - scripts/init-vault.sh

  unseal:vault:
    desc: Unseal Vault with 3 keys from vault-init.json
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/unseal-vault.sh

  config:vault:
    desc: Audit device to stdout, token reviewer SA and SA-reader RBAC
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/config-vault.sh

  # ==========================================================================
  # PostgreSQL and database secrets engine
  # ==========================================================================
  install:postgres:
    desc: Deploy PostgreSQL 16 with bootstrap SQL (dev database, orders and payments schemas, group role)
    cmds:
      - scripts/install-postgres.sh

  config:db-secret:
    desc: Database secrets engine at database/, pg-dev connection, dev-orders role, rotate-root
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/config-db-secret.sh {{.db_default_ttl}} {{.db_max_ttl}}

  clean:leases:
    desc: Revoke every dynamic database lease (break-glass)
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/vault.sh lease revoke -prefix database/creds/

  # ==========================================================================
  # Better Auth and Dex
  # ==========================================================================
  config:aliases:
    desc: CoreDNS aliases so pods reach auth.localhost and dex.localhost
    cmds:
      - scripts/config-aliases.sh

  install:dex:
    desc: Deploy Dex with static users (testuser, reportuser, nogroupuser) and create the Better Auth Secret
    cmds:
      - scripts/install-dex.sh {{.dex_chart_version}} {{.dex_version_tag}} {{.dex_host_port}} {{.auth_host_port}}

  config:auth-db:
    desc: Create Better Auth's database and owner in PostgreSQL
    cmds:
      - scripts/config-auth-db.sh

  auth:deps:
    desc: Install the Better Auth service's npm packages
    dir: auth
    status:
      - test node_modules/.package-lock.json -nt package-lock.json
    cmds:
      - npm ci --ignore-scripts --no-audit --no-fund

  auth:build:
    desc: Build the Better Auth image and import it into the k3d cluster
    run: once
    cmds:
      - mkdir -p .tmp
      - "{{.container_cli}} build -t {{.auth_image}} auth"
      - "{{.container_cli}} save -o .tmp/mcp-lab-auth.tar {{.auth_image}}"
      - k3d image import .tmp/mcp-lab-auth.tar -c {{.cluster_name}}
      - rm -f .tmp/mcp-lab-auth.tar

  auth:migrate:
    desc: Run Better Auth database migrations as a Kubernetes Job
    env: &auth-env
      AUTH_IMAGE: "{{.auth_image}}"
      AUTH_HOST_PORT: "{{.auth_host_port}}"
      DEX_HOST_PORT: "{{.dex_host_port}}"
      MCP_HOST_PORT: "{{.mcp_host_port}}"
      ACCESS_TOKEN_TTL_SECONDS: "{{.access_token_ttl_seconds}}"
      SIGN_IN_TTL_SECONDS: "{{.sign_in_ttl_seconds}}"
    cmds:
      - task: auth:build
      - scripts/deploy-auth.sh migrate

  auth:seed-clients:
    desc: Create or correct the OAuth clients as a Kubernetes Job
    env: *auth-env
    cmds:
      - task: auth:build
      - scripts/deploy-auth.sh seed

  auth:deploy:
    desc: Build Better Auth, migrate, seed clients and deploy (http://localhost:{{.auth_host_port}})
    env: *auth-env
    cmds:
      - task: auth:build
      - scripts/deploy-auth.sh all

  # ==========================================================================
  # MCP server: Vault login (auth/kubernetes) and deployment
  # ==========================================================================
  config:k8s-auth:
    desc: auth/kubernetes (annotations as alias metadata), templated mcp-server policy and role
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/config-k8s-auth.sh {{.token_ttl}} {{.token_max_ttl}}

  deploy:mcp-server:
    desc: Build/import the image and deploy the orders MCP server (http://localhost:{{.mcp_host_port}}/mcp)
    cmds:
      - task: build
      - >-
        MCP_HOST_PORT={{.mcp_host_port}} AUTH_HOST_PORT={{.auth_host_port}}
        scripts/deploy-workloads.sh vault/servers.json mcp-server-deployment mcp-orders mcp-server
        {{.app_image}} {{.vault_image}}:{{.vault_version_tag}}

  # ==========================================================================
  # MCP clients
  # ==========================================================================
  deploy:mcp-clients:
    desc: Deploy the MCP client pods (orders-agent, reporting-agent, unlisted)
    cmds:
      - task: build
      - >-
        CLIENT_INTERVAL_SECONDS={{.client_interval_seconds}} MCP_HOST_PORT={{.mcp_host_port}} AUTH_HOST_PORT={{.auth_host_port}}
        scripts/deploy-workloads.sh auth/mcp-clients.json mcp-client-deployment mcp-client none
        {{.app_image}} none

  mcp:login:
    desc: "Print an access token for a lab user without a browser (LAB_USER=testuser)"
    silent: true
    cmds:
      - AUTH_HOST_PORT={{.auth_host_port}} MCP_HOST_PORT={{.mcp_host_port}} scripts/oauth-login.sh {{.LAB_USER | default "testuser"}}

  mcp:inspector:
    desc: Open the MCP Inspector web UI on the MCP server, with OAuth sign-in
    preconditions:
      - sh: command -v npx >/dev/null && node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>22||(a===22&&b>=19)?0:1)'
        msg: "mcp:inspector needs npx and Node >= 22.19 (Inspector v2)"
    cmds:
      - scripts/mcp-inspector.sh {{.inspector_version}} http://localhost:{{.mcp_host_port}}/mcp

  # ==========================================================================
  # Vault UI (root token, demo only; macOS: pbcopy and open)
  # ==========================================================================
  token:
    desc: Copy the Vault root token to the clipboard (demo only, macOS)
    preconditions:
      - sh: '[ "$(uname -s)" = Darwin ]'
        msg: "token uses pbcopy (macOS only); elsewhere read .root_token from vault-init.json"
    cmds:
      # root_token (scripts/lib.sh) reads vault-init.json and fails with a hint if it is missing.
      # Check the value before pbcopy so a failure never empties the clipboard.
      - |
        tok="$(bash -c 'source scripts/lib.sh && root_token')"
        case "${tok}" in
          "" | null) echo "ERROR: no root_token in vault-init.json" >&2; exit 1 ;;
        esac
        printf '%s' "${tok}" | pbcopy
        echo "Vault root token copied to the clipboard"

  ui:
    desc: Copy the root token and open the Vault UI (macOS)
    cmds:
      - task: token
      - open "${VAULT_ADDR:-http://127.0.0.1:8200}/ui"

  # ==========================================================================
  # Demo scenarios (docs/walkthrough.md)
  # ==========================================================================
  demo:mcp:
    desc: M1-M8 - the MCP server's own short-lived, least-privileged database access
    cmds:
      - MCP_HOST_PORT={{.mcp_host_port}} AUTH_HOST_PORT={{.auth_host_port}} scripts/demo-mcp.sh

  demo:mcp-auth:
    desc: A1-A12 - pod login - 401s, forged/expired tokens, scope limits, central revoke, audit
    cmds:
      - >-
        MCP_HOST_PORT={{.mcp_host_port}} AUTH_HOST_PORT={{.auth_host_port}}
        ACCESS_TOKEN_TTL_SECONDS={{.access_token_ttl_seconds}}
        scripts/demo-mcp-auth.sh {{.demo_token_ttl_seconds}}

  demo:human-auth:
    desc: H1-H13 - people sign in through Better Auth and Dex and get only what their groups allow
    cmds:
      - MCP_HOST_PORT={{.mcp_host_port}} AUTH_HOST_PORT={{.auth_host_port}} SIGN_IN_TTL_SECONDS={{.sign_in_ttl_seconds}} scripts/demo-human-auth.sh

  docs:diagrams:
    desc: Render the doc diagrams (docs/diagrams/*.py -> docs/images/*.png); needs uv and Graphviz
    dir: docs/diagrams
    cmds:
      - |
        unset VIRTUAL_ENV  # use docs/diagrams/.venv, not an outer activated venv
        for f in architecture token_flow dynamic_db human_login; do
          echo "Rendering ${f}..."
          uv run --frozen python "${f}.py"
        done

  status:
    desc: Show cluster, Vault and workload status
    silent: true
    cmds:
      - kubectl --context "$KUBECONTEXT" get nodes
      - kubectl --context "$KUBECONTEXT" get pods -A -l 'app.kubernetes.io/name in (vault,postgres,better-auth,dex,mcp-orders,mcp-client)' 2>/dev/null || true
      - vault status -address=http://127.0.0.1:8200 || true

  logs:
    desc: "Follow logs (NS=mcp-server-dev|mcp-client-orders-agent|..., C=app|vault-proxy)"
    cmds:
      - kubectl --context "$KUBECONTEXT" logs -f -n {{.NS | default "mcp-server-dev"}} -l 'app.kubernetes.io/name in (mcp-orders,mcp-client)' -c {{.C | default "app"}}

  logs:vault:
    desc: Follow Vault's audit and server log
    cmds:
      - kubectl --context "$KUBECONTEXT" logs -f vault-0 -n vault
